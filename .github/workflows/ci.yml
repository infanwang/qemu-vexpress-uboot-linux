name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Bash 语法检查
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check
        run: |
          set -e
          for f in scripts/*.sh configs/*.sh; do
            echo "==> $f"
            bash -n "$f"
          done

  # 2. shellcheck（只把 error 当失败，warning 放过）
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck (errors only)
        run: shellcheck --severity=error scripts/*.sh configs/*.sh

  # 3. 校验 artifacts 的 SHA256
  verify-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify SHA256SUMS
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

  # 4. 验证 boot.scr.uimg 能由 boot.cmd 重新生成
  verify-boot-scr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install u-boot-tools
        run: sudo apt-get update && sudo apt-get install -y u-boot-tools

      - name: Rebuild boot.scr.uimg from boot.cmd
        run: |
          mkimage -A arm -T script -C none -n "vexpress boot" \
            -d configs/boot.cmd /tmp/boot.scr.uimg

          echo "--- 仓库中的 ---"
          mkimage -l configs/boot.scr.uimg
          echo "--- 重新生成的 ---"
          mkimage -l /tmp/boot.scr.uimg

          # 大小必须一致（时间戳会变，所以不比较字节）
          a=$(stat -c%s configs/boot.scr.uimg)
          b=$(stat -c%s /tmp/boot.scr.uimg)
          echo "size: repo=$a rebuilt=$b"
          [ "$a" = "$b" ]
